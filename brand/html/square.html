<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@1&family=Schibsted+Grotesk:wght@600&family=Spline+Sans+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; width: 1080px; height: 1080px; background: #202B22; color: #FAF6E9; }
    body { font-family: "Instrument Sans", system-ui, sans-serif; box-sizing: border-box; padding: 72px; display: flex; flex-direction: column; }
    .lockup { display: flex; align-items: center; gap: 16px; }
    .word { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 40px; }
    h1 { font-family: "Schibsted Grotesk", system-ui, sans-serif; font-weight: 600; font-size: 72px; letter-spacing: -0.03em; line-height: 1.05; margin: auto 0; }
    h1 span { color: #FFD85F; display: block; }
    .foot { font-family: "Spline Sans Mono", ui-monospace, monospace; font-size: 16px; color: #FFD85F; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <div class="lockup">
    <svg width="44" height="44" viewBox="0 0 64 64" fill="none">
      <rect x="11" y="21" width="42" height="9" rx="4.5" fill="#FFD85F" />
      <rect x="12.5" y="35.5" width="39" height="6" rx="3" stroke="#FFD85F" stroke-width="3" />
    </svg>
    <div class="word">Equilux</div>
  </div>
  <h1>Prove the pay gap.<span>Reveal no one.</span></h1>
  <div class="foot">MIDNIGHT · COMPACT · WAVE 1</div>
</body>
</html>
